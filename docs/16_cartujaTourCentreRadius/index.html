<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Cartuja Walking Tour</title>
	<link rel="shortcut icon" href="favicon.ico" />
	<link rel="apple-touch-icon" href="favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- via https://leafletjs.com/examples/mobile/ to disallow user scaling -->
	<link rel="stylesheet" href="../css/leaflet.css" />
	<script src="js/leaflet/leaflet.js"></script>
	<style>
		html, body { height: 100%; width: 100%; padding: 0; margin: 0; }
		body { font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
		#map { position: absolute; inset: 0; }

		/* status / debug panel (top-left) */
		#status {
			position: absolute; top: 8px; left: 8px; z-index: 1000;
			max-width: 60vw; padding: 8px 10px; border-radius: 8px;
			background: rgba(255, 255, 255, 0.92); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
			font-size: 12px; line-height: 1.4; color: #222;
		}
		#status b { color: #111; }
		#status .warn { color: #c0392b; font-weight: bold; }
		#status .ok { color: #2e7d32; }

		/* media card (bottom) — only shown when inside a zone */
		#media {
			position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000;
			display: none; padding: 8px; border-radius: 10px;
			background: rgba(255, 255, 255, 0.96); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
			text-align: center;
		}
		#media.visible { display: block; }
		#media h2 { margin: 0 0 6px; font-size: 16px; color: #2e7d32; }
		#media img { max-width: 100%; max-height: 30vh; border-radius: 6px; display: block; margin: 0 auto; }
		#media p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: #333; text-align: left; max-height: 18vh; overflow-y: auto; }

		/* pagers: a stop can have several images and several pieces of text */
		.pager { position: relative; }
		.pager .nav {
			position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
			width: 40px; height: 40px; border: none; border-radius: 50%;
			background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 22px; line-height: 40px;
			padding: 0; cursor: pointer;
		}
		.pager .nav.prev { left: 6px; }
		.pager .nav.next { right: 6px; }
		.pager .count {
			position: absolute; right: 8px; bottom: 8px; z-index: 2;
			padding: 2px 8px; border-radius: 10px;
			background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 11px;
		}
		.textpager .textnav {
			display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px;
		}
		.textpager .textnav button {
			width: 36px; height: 36px; border: none; border-radius: 50%;
			background: #e8e8e8; color: #333; font-size: 18px; cursor: pointer;
		}
		.textpager .textnav span { font-size: 12px; color: #666; }
	</style>
</head>

<body>
	<div id="map"></div>
	<div id="status">Locating you&hellip; please allow location access.</div>
	<div id="media"></div>

	<script>
		// ---- Tuning -------------------------------------------------------------
		// How we decide you are "at" a location (centre + radius geofencing):
		//   enterRadius = zone.radius + min(gpsAccuracy, ACCURACY_CAP)
		//   exitRadius  = enterRadius + HYSTERESIS
		// Hysteresis stops the media flickering on/off when you stand on a boundary.
		const ACCURACY_CAP = 30;        // metres of GPS slop we let expand a zone by
		const HYSTERESIS = 15;          // metres you must move back out before a zone closes
		const WEAK_FIX_ACCURACY = 80;   // metres: above this the fix is too vague to trust for triggering

		const PARK_CENTRE = [37.1926, -3.5968]; // Cartuja campus, Granada

		// ---- Map ----------------------------------------------------------------
		const map = L.map('map').setView(PARK_CENTRE, 16);
		L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 19,
			attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
		}).addTo(map);

		// User position: a dot + an honest accuracy circle (full e.accuracy radius).
		const userDot = L.circleMarker(PARK_CENTRE, {
			radius: 7, color: '#fff', weight: 2, fillColor: '#1976d2', fillOpacity: 1
		}).addTo(map);
		const accuracyCircle = L.circle(PARK_CENTRE, { radius: 0, color: '#1976d2', weight: 1, fillOpacity: 0.12 }).addTo(map);

		const statusEl = document.getElementById('status');
		const mediaEl = document.getElementById('media');

		// ---- Zones --------------------------------------------------------------
		let zones = [];          // { name, images, imagesNote, descriptions, latlng, radius, circle, active }
		let firstFixCentred = false;
		let lastFixAt = null;    // when the most recent GPS fix arrived

		function loadZones(geojson) {
			geojson.features.forEach(f => {
				const [lng, lat] = f.geometry.coordinates;
				const latlng = L.latLng(lat, lng);
				const radius = f.properties.radius;
				const circle = L.circle(latlng, {
					radius, color: '#888', weight: 1, fillColor: '#888', fillOpacity: 0.15
				}).addTo(map).bindTooltip(f.properties.name, { direction: 'top' });
				zones.push({
					name: f.properties.name,
					images: f.properties.images || [],
					imagesNote: f.properties.imagesNote || '',
					descriptions: f.properties.descriptions || [],
					latlng, radius, circle, active: false
				});
			});
		}

		// ---- Location updates ---------------------------------------------------
		function onLocationFound(e) {
			lastFixAt = Date.now();
			const acc = e.accuracy;            // metres; in Leaflet this is already the radius
			userDot.setLatLng(e.latlng);
			accuracyCircle.setLatLng(e.latlng).setRadius(acc);

			if (!firstFixCentred) { map.setView(e.latlng, 17); firstFixCentred = true; }

			const weak = acc > WEAK_FIX_ACCURACY;
			const effAcc = Math.min(acc, ACCURACY_CAP);

			// Evaluate every zone against the current fix.
			let nearest = null, nearestDist = Infinity;
			const activeZones = [];
			zones.forEach(z => {
				const dist = e.latlng.distanceTo(z.latlng); // metres
				if (dist < nearestDist) { nearestDist = dist; nearest = z; }

				const enterR = z.radius + effAcc;
				const exitR = enterR + HYSTERESIS;
				if (!z.active && !weak && dist <= enterR) {
					z.active = true;
				} else if (z.active && dist > exitR) {
					z.active = false;
				}
				z.circle.setStyle(z.active
					? { color: '#2e7d32', fillColor: '#2e7d32', fillOpacity: 0.35 }
					: { color: '#888', fillColor: '#888', fillOpacity: 0.15 });
				if (z.active) activeZones.push(z);
			});

			// Show media for the nearest active zone (zones can overlap — several
			// stops here are within a few metres of each other, so nearest wins).
			activeZones.sort((a, b) => e.latlng.distanceTo(a.latlng) - e.latlng.distanceTo(b.latlng));
			showMedia(activeZones[0] || null);

			// Status / debug readout.
			statusEl.innerHTML =
				`<b>Lat:</b> ${e.latlng.lat.toFixed(6)} <b>Lng:</b> ${e.latlng.lng.toFixed(6)}<br/>` +
				`<b>Accuracy:</b> ${Math.round(acc)} m ` +
				(weak ? `<span class="warn">(too weak to trigger)</span>` : `<span class="ok">(ok)</span>`) + `<br/>` +
				`<b>Nearest:</b> ${nearest ? nearest.name : '-'} ` +
				`${nearest ? '(' + Math.round(nearestDist) + ' m)' : ''}<br/>` +
				`<b>Last fix:</b> <span id="fixage"></span> ago`;
		}

		// The browser already delivers fixes as fast as the phone's GPS provides them
		// (watch: true, maximumAge: 0) — this readout makes that cadence visible.
		setInterval(() => {
			const el = document.getElementById('fixage');
			if (el && lastFixAt) el.textContent = ((Date.now() - lastFixAt) / 1000).toFixed(1) + ' s';
		}, 250);

		function onLocationError(e) {
			statusEl.innerHTML = `<span class="warn">Location error:</span> ${e.message}.<br/>` +
				`Geolocation is required to find yourself on the map.`;
		}

		// ---- Media card with image + text cycling -------------------------------
		let shownZone = null;
		let imgIndex = 0, textIndex = 0;

		function showMedia(zone) {
			if (zone === shownZone) return;       // no flicker / no image reload
			shownZone = zone;
			imgIndex = 0; textIndex = 0;          // fresh stop, start at the first page
			if (!zone) { mediaEl.classList.remove('visible'); mediaEl.innerHTML = ''; return; }

			const multiImg = zone.images.length > 1;
			const multiText = zone.descriptions.length > 1;
			mediaEl.innerHTML =
				`<h2>${zone.name}</h2>` +
				`<div class="pager">` +
					(multiImg ? `<button class="nav prev" id="imgPrev">&lsaquo;</button>` : '') +
					`<img id="mediaImg" src="${zone.images[0]}" alt="${zone.imagesNote || zone.name}">` +
					(multiImg ? `<button class="nav next" id="imgNext">&rsaquo;</button>` +
						`<div class="count" id="imgCount"></div>` : '') +
				`</div>` +
				(zone.descriptions.length ? `<div class="textpager">` +
					`<p id="mediaText"></p>` +
					(multiText ? `<div class="textnav">` +
						`<button id="textPrev">&lsaquo;</button>` +
						`<span id="textCount"></span>` +
						`<button id="textNext">&rsaquo;</button>` +
					`</div>` : '') +
				`</div>` : '');
			mediaEl.classList.add('visible');

			const step = (which, dir) => {
				if (which === 'img') imgIndex = (imgIndex + dir + zone.images.length) % zone.images.length;
				else textIndex = (textIndex + dir + zone.descriptions.length) % zone.descriptions.length;
				render();
			};
			if (multiImg) {
				document.getElementById('imgPrev').onclick = () => step('img', -1);
				document.getElementById('imgNext').onclick = () => step('img', +1);
				document.getElementById('mediaImg').onclick = () => step('img', +1); // tap photo to advance
			}
			if (multiText) {
				document.getElementById('textPrev').onclick = () => step('text', -1);
				document.getElementById('textNext').onclick = () => step('text', +1);
			}

			function render() {
				document.getElementById('mediaImg').src = zone.images[imgIndex];
				if (multiImg) document.getElementById('imgCount').textContent = `${imgIndex + 1}/${zone.images.length}`;
				if (zone.descriptions.length) {
					const t = document.getElementById('mediaText');
					t.textContent = zone.descriptions[textIndex];
					t.scrollTop = 0;
				}
				if (multiText) document.getElementById('textCount').textContent = `${textIndex + 1} of ${zone.descriptions.length}`;
			}
			render();
		}

		map.on('locationfound', onLocationFound);
		map.on('locationerror', onLocationError);

		// ---- Load data, then start watching -------------------------------------
		fetch('data/tour.geojson')
			.then(r => r.json())
			.then(geojson => {
				loadZones(geojson);
				// https://leafletjs.com/reference.html#map-locate
				map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
			})
			.catch(err => { statusEl.innerHTML = `<span class="warn">Could not load tour data:</span> ${err}`; });
	</script>
</body>

</html>
